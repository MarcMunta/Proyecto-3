[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p3-cpd"
version = "0.1.0"
description = "Sistema de predicción de viabilidad para la instalación de un CPD (data center) en municipios españoles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["cpd*"]   # src/ingesta son scripts sueltos, no un paquete

[tool.pytest.ini_options]
testpaths = ["tests"]
